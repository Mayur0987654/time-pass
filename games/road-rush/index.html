<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road Rush • TimePassLab</title><link rel="stylesheet" href="../../css/style.css"></head><body>
<header class="nav-wrap"><nav class="nav container"><a class="brand" href="../../index.html"><span class="brand-dot"></span>TimePassLab</a><div class="nav-links"><a href="../../index.html">Home</a><a href="../../tools/index.html">Tools</a><a class="active" href="../index.html">Games</a></div></nav></header>
<main class="container game-shell"><section class="page-head"><div class="eyebrow">GAME</div><h1>Road Rush</h1><p>Dodge traffic. Speed increases over time.</p></section><div class="game-info"><div class="pill">Score: <b id="score">0</b></div><div class="pill">Best: <b id="best">0</b></div><div class="pill">Speed: <b id="speed">1.0x</b></div></div><canvas id="game" class="game-canvas" width="360" height="600"></canvas><div class="controls"><button class="control-btn" id="left">←</button><button class="control-btn" id="restart">↻</button><button class="control-btn" id="right">→</button></div><div class="hint">Keyboard: ← → or A D • Tap ↻ to restart after a crash</div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');const W=c.width,H=c.height;let lane=1,player={w:44,h:72},enemies=[],score=0,speed=4,over=false,lastSpawn=0;let best=Number(localStorage.timepasslabRoadBest||0);document.getElementById('best').textContent=best;
function reset(){lane=1;enemies=[];score=0;speed=4;over=false;lastSpawn=0;requestAnimationFrame(loop)}
function laneX(l,w=44){return 60+l*120+(120-w)/2}
function spawn(){let l=Math.floor(Math.random()*3);enemies.push({lane:l,y:-90,w:44,h:72});}
function move(d){if(!over)lane=Math.max(0,Math.min(2,lane+d))}
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))move(-1);if(['ArrowRight','d','D'].includes(e.key))move(1);if(e.key==='r'&&over)reset()});document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('restart').onclick=()=>{if(over)reset()};
function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
let prev=0;function loop(t){if(over)return draw();let dt=Math.min(32,t-prev||16);prev=t;speed=4+score/1800;if(t-lastSpawn>Math.max(450,1050-score/10)){spawn();lastSpawn=t}enemies.forEach(e=>e.y+=speed*dt/16);enemies=enemies.filter(e=>{if(e.y>H+80){score+=25;return false}return true});let p={x:laneX(lane),y:H-105,w:player.w,h:player.h};for(const e of enemies){let r={x:laneX(e.lane,e.w),y:e.y,w:e.w,h:e.h};if(rects(p,r)){over=true;best=Math.max(best,Math.floor(score));localStorage.timepasslabRoadBest=best;document.getElementById('best').textContent=best;break}}score+=dt*.018;document.getElementById('score').textContent=Math.floor(score);document.getElementById('speed').textContent=(speed/4).toFixed(1)+'x';draw();if(!over)requestAnimationFrame(loop)}
function car(px,py,enemy=false){x.fillStyle=enemy?'#ff5f7d':'#5be3ff';x.fillRect(px,py,44,72);x.fillStyle='#10131d';x.fillRect(px+8,py+10,28,17);x.fillRect(px+8,py+43,28,16);x.fillStyle='#d9e0ff';x.fillRect(px+4,py+5,5,12);x.fillRect(px+35,py+5,5,12)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#151a24';x.fillRect(0,0,W,H);x.fillStyle='#262d3b';x.fillRect(8,0,8,H);x.fillRect(W-16,0,8,H);x.strokeStyle='#4a536a';x.lineWidth=3;x.setLineDash([24,22]);for(let i=1;i<3;i++){x.beginPath();x.moveTo(i*120,0);x.lineTo(i*120,H);x.stroke()}x.setLineDash([]);enemies.forEach(e=>car(laneX(e.lane,e.w),e.y,true));car(laneX(lane),H-105,false);if(over){x.fillStyle='rgba(4,6,12,.72)';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='bold 32px system-ui';x.fillText('CRASHED',W/2,H/2-20);x.font='16px system-ui';x.fillStyle='#aeb7cc';x.fillText('Tap ↻ or press R to restart',W/2,H/2+18)}}reset();
</script></body></html>
